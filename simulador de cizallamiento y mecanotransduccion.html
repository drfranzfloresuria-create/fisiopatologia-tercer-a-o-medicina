<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Mecanotransducción Endotelial</title>
    <style>
        :root {
            --laminar-color: #2ecc71;
            --turbulent-color: #e74c3c;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        #btn-laminar {
            background-color: #eaebec;
            color: #333;
        }
        #btn-turbulento {
            background-color: #eaebec;
            color: #333;
        }
        button.active-laminar {
            background-color: var(--laminar-color) !important;
            color: white !important;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
        }
        button.active-turbulento {
            background-color: var(--turbulent-color) !important;
            color: white !important;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.4);
        }
        .simulation-area {
            position: relative;
            height: 250px;
            background-color: #f1f2f6;
            border: 2px solid #ced6e0;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        /* Células Endoteliales */
        .endothelium {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding-bottom: 10px;
            border-bottom: 6px solid #ff7f50; /* Lámina elástica / Media */
        }
        .cell {
            background-color: #82ccdd;
            border: 2px solid #60a3bc;
            transition: all 0.8s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Estado Laminar */
        .cell.fusiform {
            width: 120px;
            height: 30px;
            border-radius: 50% / 100%; /* Forma de huso/elongada */
        }
        /* Estado Turbulento */
        .cell.irregular {
            width: 80px;
            height: 50px;
            border-radius: 20px 40px 10px 30px; /* Forma irregular/poligonal */
        }
        /* Núcleo */
        .nucleus {
            width: 15px;
            height: 15px;
            background-color: #3c6382;
            border-radius: 50%;
            transition: all 0.8s ease;
        }
        .fusiform .nucleus { width: 25px; height: 10px; }
        
        /* Canal Piezo 1 */
        .piezo1 {
            position: absolute;
            top: -5px;
            width: 15px;
            height: 10px;
            background-color: #9b59b6;
            border-radius: 50px 50px 0 0;
            transition: all 0.5s ease;
        }
        .cell.irregular .piezo1 {
            top: -2px;
            width: 20px;
            height: 4px; /* Se aplana */
            background-color: #8e44ad;
            border-radius: 0;
        }

        /* Moléculas */
        .molecule {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }
        @keyframes floatDown {
            0% { transform: translateY(-20px); opacity: 1; }
            100% { transform: translateY(20px); opacity: 0; }
        }

        /* Partículas de Sangre */
        .blood-flow {
            position: absolute;
            top: 20%;
            left: -50px;
            width: 20px;
            height: 5px;
            background-color: rgba(231, 76, 60, 0.6);
            border-radius: 10px;
        }
        @keyframes flowLaminar {
            0% { left: -50px; opacity: 1; }
            100% { left: 100%; opacity: 1; }
        }
        @keyframes flowTurbulent {
            0% { left: -50px; transform: rotate(0deg) translateY(0); opacity: 1;}
            50% { transform: rotate(180deg) translateY(50px); opacity: 0.8;}
            100% { left: 100%; transform: rotate(360deg) translateY(-20px); opacity: 0;}
        }

        .data-panel {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .data-card {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #7f8fa6;
        }
        h3 { margin-top: 0; font-size: 16px; color: #2f3640; }
        p { margin: 0; font-size: 14px; color: #576574; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Simulador de Cizallamiento y Canal Piezo 1</h1>
        
        <div class="controls">
            <button id="btn-laminar" onclick="setFlow('laminar')">Flujo Laminar (Vaso Recto)</button>
            <button id="btn-turbulento" onclick="setFlow('turbulento')">Flujo Turbulento (Bifurcación)</button>
        </div>

        <div class="simulation-area" id="sim-area">
            <!-- Partículas de flujo generadas por JS -->
            <div class="endothelium" id="endothelium">
                <!-- Células generadas por JS -->
            </div>
        </div>

        <div class="data-panel">
            <div class="data-card" id="card-mecanica">
                <h3>Fuerza Mecánica (ESS)</h3>
                <p id="desc-mecanica">Seleccione un régimen de flujo para observar la tensión de cizallamiento.</p>
            </div>
            <div class="data-card" id="card-biologica">
                <h3>Respuesta Celular</h3>
                <p id="desc-biologica">-</p>
            </div>
        </div>
    </div>

    <script>
        const endothelium = document.getElementById('endothelium');
        const simArea = document.getElementById('sim-area');
        let flowInterval;
        let moleculeInterval;

        // Inicializar células
        for(let i=0; i<5; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell fusiform';
            cell.innerHTML = '<div class="piezo1"></div><div class="nucleus"></div>';
            endothelium.appendChild(cell);
        }

        function createFlowParticle(type) {
            const particle = document.createElement('div');
            particle.className = 'blood-flow';
            particle.style.top = Math.random() * 60 + 10 + '%';
            
            if (type === 'laminar') {
                particle.style.animation = `flowLaminar ${Math.random() * 1 + 1.5}s linear infinite`;
                particle.style.height = '4px';
                particle.style.width = '30px';
            } else {
                particle.style.animation = `flowTurbulent ${Math.random() * 2 + 2}s ease-in-out infinite`;
                particle.style.height = '10px';
                particle.style.width = '10px';
                particle.style.borderRadius = '50%';
            }
            simArea.appendChild(particle);
            setTimeout(() => particle.remove(), 4000);
        }

        function createMolecule(type) {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                if(Math.random() > 0.5) return; // Efecto aleatorio
                const mol = document.createElement('div');
                mol.className = 'molecule';
                
                if(type === 'NO') {
                    mol.innerText = 'NO';
                    mol.style.color = '#2ecc71';
                    mol.style.top = '-20px';
                    mol.style.animation = 'floatUp 2s forwards';
                } else if(type === 'Ca') {
                    mol.innerText = 'Ca2+';
                    mol.style.color = '#e74c3c';
                    mol.style.top = '-10px';
                    mol.style.animation = 'floatDown 2s forwards';
                }
                cell.appendChild(mol);
                setTimeout(() => mol.remove(), 2000);
            });
        }

        function setFlow(type) {
            clearInterval(flowInterval);
            clearInterval(moleculeInterval);
            document.querySelectorAll('.blood-flow').forEach(e => e.remove());

            const btnLaminar = document.getElementById('btn-laminar');
            const btnTurbulento = document.getElementById('btn-turbulento');
            const cells = document.querySelectorAll('.cell');
            
            if (type === 'laminar') {
                btnLaminar.className = 'active-laminar';
                btnTurbulento.className = '';
                
                cells.forEach(c => {
                    c.classList.remove('irregular');
                    c.classList.add('fusiform');
                });

                document.getElementById('desc-mecanica').innerHTML = "<strong>Fuerza de Cizallamiento (ESS) Alta y Unidireccional.</strong> El vector tangencial induce la reorganización del citoesqueleto.";
                document.getElementById('desc-biologica').innerHTML = "<strong>Estado Ateroprotector.</strong> Las células adoptan forma fusiforme. El canal Piezo 1 permanece estable, promoviendo la síntesis de <strong>Óxido Nítrico (NO)</strong>.";

                flowInterval = setInterval(() => createFlowParticle('laminar'), 200);
                moleculeInterval = setInterval(() => createMolecule('NO'), 1000);

            } else {
                btnLaminar.className = '';
                btnTurbulento.className = 'active-turbulento';
                
                cells.forEach(c => {
                    c.classList.remove('fusiform');
                    c.classList.add('irregular');
                });

                document.getElementById('desc-mecanica').innerHTML = "<strong>ESS Bajo y Oscilatorio (Remolinos).</strong> La fricción tangencial cambia constantemente de dirección, simulando una bifurcación.";
                document.getElementById('desc-biologica').innerHTML = "<strong>Estado Pro-inflamatorio.</strong> Las células pierden su alineación. Las hélices del <strong>canal Piezo 1 se aplanan</strong>, abriendo el poro y permitiendo el influjo masivo de <strong>Calcio (Ca2+)</strong> intracelular.";

                flowInterval = setInterval(() => createFlowParticle('turbulento'), 300);
                moleculeInterval = setInterval(() => createMolecule('Ca'), 800);
            }
        }
        
        // Iniciar en estado laminar
        setFlow('laminar');
    </script>
</body>
</html>
